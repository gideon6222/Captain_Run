<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3aa8ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Candle Gift</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- The error overlay handler must come BEFORE the entry script.

     Vite hoists the bundled module into <head> at build time, so a handler
     left down in <body> - where this used to be - is registered too late to
     catch a boot error, and on a phone with no devtools that is the only way
     to see a stack trace at all. After changing anything in here, verify by
     deliberately breaking an import, building, and confirming the overlay
     still shows the error. -->
<script>
  function showErr(m){
    var e = document.getElementById('err');
    if(!e) return;
    e.classList.remove('hidden');
    e.textContent += m + '\n\n';
    var b = document.getElementById('boot');
    if (b) b.classList.add('hidden');
  }
  window.addEventListener('error', function(e){
    showErr('ERROR: ' + (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    showErr('PROMISE: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
  });
</script>

<style>
  /* Fredoka, self-hosted. The reference's type is a chunky rounded sans and a
     system stack cannot get near it; 30 KB of variable woff2 changes every
     screen, which ASSETS.md calls the single best import available. Local and
     preloaded, because a font that arrives late reflows the HUD on the first
     frame the player sees, and an external stylesheet is a request that fails
     offline in an installed PWA. */
  @font-face{
    font-family:'Fredoka';
    src:url('fonts/fredoka-latin.woff2') format('woff2');
    font-weight:300 700; font-style:normal; font-display:swap;
  }

  /* Candy, not craft. Hot pink signage, white chunky panels with a dark
     outline, green money. The reference is relentlessly bright and the UI has
     to match it or the HUD reads as a different game sitting on top. */
  :root{
    --ink:#3a1548; --paper:#fffdf8; --pink:#e8226e; --pinkDark:#8e0b40;
    --mint:#3fce6a; --gold:#ffc93c; --sky:#3aa8ee; --grape:#7b3fd4;
    --edge:#2b0f36;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden; background:#3aa8ee; color:var(--ink);
    font-family:Fredoka,"Segoe UI",system-ui,-apple-system,sans-serif; font-weight:600;
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
  /* touch-action is set on the PLAY AREA, never on body.

     A browser works out what a touch is allowed to do by intersecting
     touch-action up the whole ancestor chain, so `touch-action: none` on body
     silently disables panning inside every scroller underneath it - including
     the shop sheet. That left the upgrade list unscrollable on a phone, and
     since the START button sits below the list, unscrollable meant unplayable
     past the first level. Block gestures where the game is, allow them where
     the UI is. */
  #game, #hud, #pops{ touch-action:none; }
  #game{position:fixed; inset:0;}
  canvas{display:block;}

  .out{ text-shadow: 0 2px 0 var(--edge), 0 -2px 0 var(--edge), 2px 0 0 var(--edge), -2px 0 0 var(--edge), 0 4px 8px rgba(0,0,0,.45); color:#fff; }

  #hud{position:fixed; inset:0; pointer-events:none; padding:calc(var(--safe-t) + 8px) 10px 0;}
  .toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}

  /* Chunky white pills with a dark outline, like the reference signage. */
  .panel{
    background:var(--paper); border:3px solid var(--edge); border-radius:14px;
    box-shadow:0 4px 0 var(--edge); padding:5px 11px; color:var(--ink);
  }
  #level{font-size:16px; letter-spacing:.04em; line-height:1.05; text-align:center;}
  #level small{display:block; font-size:8.5px; color:#9a6ab0; letter-spacing:.16em;}

  .money{
    background:linear-gradient(#4fe07d,#25a854); border:3px solid var(--edge); border-radius:14px;
    box-shadow:0 4px 0 var(--edge); padding:5px 12px; font-size:16px; color:#fff;
  }

  #bars{margin:9px auto 0; width:min(94%,400px);}
  #prog{
    position:relative; height:13px; border:3px solid var(--edge); border-radius:9px;
    background:rgba(255,255,255,.55); overflow:hidden; box-shadow:0 3px 0 var(--edge);
  }
  #prog i{position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(#ff8ec0,#e8226e);}

  /* candle count, left — the thing obstacles take */
  #countBox{position:fixed; left:12px; top:calc(var(--safe-t) + 108px); text-align:center;}
  #countN{font-size:42px; line-height:.95; font-weight:700;}
  #countBox small{font-size:9px; letter-spacing:.16em; display:block; color:#fff; text-shadow:0 2px 0 var(--edge);}

  /* per-candle value + cash, right */
  #valBox{position:fixed; right:12px; top:calc(var(--safe-t) + 104px); text-align:right;}
  #valBox .lbl{font-size:8.5px; letter-spacing:.14em; color:#fff; text-shadow:0 1px 0 var(--edge);}
  #eachN{font-size:22px; line-height:1.05;}
  #cashN{font-size:15px; line-height:1.4; color:#b6ffcf;}

  /* the band stack, mirroring the candles */
  #stackBox{position:fixed; right:12px; top:calc(var(--safe-t) + 186px); width:44px; text-align:center;}
  #stackBox small{font-size:8px; letter-spacing:.12em; color:#fff; text-shadow:0 1px 0 var(--edge); display:block; margin-bottom:4px;}
  #stack{display:flex; flex-direction:column; align-items:center; gap:2px;}
  #stack i{display:block; width:30px; height:9px; border:2px solid var(--edge); border-radius:3px;}

  #toast{
    position:fixed; left:0; right:0; top:29%; text-align:center; font-size:26px;
    opacity:0; transition:opacity .25s; letter-spacing:.05em;
  }
  #hint{
    position:fixed; left:0; right:0; bottom:calc(var(--safe-b) + 26px); text-align:center;
    font-size:13px; opacity:.95; transition:opacity .6s; letter-spacing:.06em;
  }
  #pops{position:fixed; inset:0; pointer-events:none; overflow:hidden;}
  .pop{position:absolute; font-size:18px; will-change:transform,opacity; white-space:nowrap;}

  /* the workshop */
  .modal{position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(40,12,60,.62); backdrop-filter:blur(3px);}
  .modal.hidden{display:none;}
  .sheet{
    width:100%; max-width:520px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain;
    touch-action:pan-y; -webkit-overflow-scrolling:touch;
    padding:16px 14px 0;
    background:linear-gradient(#fffdf8,#f4e8ff);
    border:4px solid var(--edge); border-bottom:none; border-radius:22px 22px 0 0;
    box-shadow:0 -8px 30px rgba(40,12,60,.5);
  }
  .sheet::-webkit-scrollbar{display:none;}
  .shead{position:sticky; top:-16px; margin:-16px -14px 10px; padding:14px 14px 10px;
    background:linear-gradient(#e8226e,#b3104f); border-bottom:4px solid var(--edge); z-index:2; color:#fff;}
  .shead h2{margin:0; font-size:21px; letter-spacing:.05em;}
  .shead .sub{font-size:11px; letter-spacing:.1em; margin-top:2px; color:#ffd8e8;}
  .shead .bal{display:flex; gap:14px; margin-top:9px; font-size:15px; align-items:center;}
  .shead .bal em{font-style:normal; color:#ffd8e8; font-size:10px; letter-spacing:.1em;}

  /* the result card */
  #result{
    margin:2px 0 14px; padding:12px; border:4px solid var(--edge); border-radius:16px;
    background:linear-gradient(#fff8fc,#ffe9f4); box-shadow:0 4px 0 var(--edge);
  }
  #result.hidden{display:none;}
  #gauge{
    position:relative; height:150px; margin:2px 0 12px; border:4px solid var(--edge);
    border-radius:14px; background:linear-gradient(#efe4fb,#fff); overflow:hidden;
    box-shadow:inset 0 3px 0 rgba(0,0,0,.08);
  }
  #gaugeFill{position:absolute; inset:auto 0 0 0; height:0%;
    background:linear-gradient(#ff8ec0,#e8226e); transition:height 1.1s cubic-bezier(.2,.8,.2,1);}
  #gaugeTicks{position:absolute; inset:0; z-index:2;}
  #gaugeTicks i{position:absolute; left:0; right:0; border-top:2px dashed rgba(60,20,80,.22);
    font-style:normal; font-size:10px; color:#7a5a8c; padding-left:6px; font-weight:700;}
  #gaugeMark{position:absolute; left:0; right:0; height:4px; background:var(--edge); bottom:0; z-index:3;
    transition:bottom 1.1s cubic-bezier(.2,.8,.2,1);}
  #rStars{text-align:center; margin-bottom:8px;}
  #rStars i{font-style:normal; font-size:34px; color:#dcc9e8; margin:0 3px;
    text-shadow:0 2px 0 rgba(0,0,0,.15);}
  #rStars i.on{color:var(--gold); text-shadow:0 2px 0 #a06a00;}
  .rrow{display:flex; align-items:baseline; gap:8px; padding:4px 0; font-size:12px;
    border-top:1px solid rgba(60,20,80,.12);}
  .rrow:first-child{border-top:none;}
  .rk{width:78px; flex:none; color:var(--pink); letter-spacing:.1em; font-size:10.5px;}
  .rd{flex:1; color:#7a5a8c; font-weight:700;}
  .rv{color:var(--ink); font-size:13px;}
  .rtot{display:flex; justify-content:space-between; align-items:center; margin-top:9px; padding-top:9px;
    border-top:3px solid rgba(60,20,80,.2);}
  .rtot span{font-size:10.5px; letter-spacing:.14em; color:var(--pink);}
  .rtot b{font-size:26px; color:#1c9e4c;}

  .counter{margin-top:12px;}
  .counter h3{
    margin:0 0 6px; font-size:11px; letter-spacing:.2em; color:var(--pink);
    border-bottom:3px solid #f6d6e6; padding-bottom:4px;
  }
  .up{display:flex; align-items:center; gap:9px; padding:7px 0;}
  .upic{width:36px; height:36px; flex:none; border:3px solid var(--edge); border-radius:11px;
    display:flex; align-items:center; justify-content:center; font-size:17px; background:#ffe3f0;}
  .upinfo{flex:1; min-width:0;}
  .upname{font-size:13.5px; color:#fff;}
  .upeff{font-size:10.5px; color:#7a5a8c; margin-top:2px; font-weight:700;}
  .buy{
    border:3px solid var(--edge); border-radius:12px; padding:9px 12px; font-size:13px; font-weight:800;
    background:linear-gradient(#4fe07d,#25a854); color:#06331a; box-shadow:0 4px 0 var(--edge);
    white-space:nowrap; min-width:76px; font-family:inherit;
  }
  .buy:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge);}
  .buy.no{background:linear-gradient(#d8cfe0,#a898b8); color:#5f4a70;}
  .buy.max{background:linear-gradient(#ffd96a,#e0a010); color:#4a2f00;}
  .up.locked{opacity:.6;}
  .up.locked .upic{background:#e6dcee;}
  .lockmsg{font-size:11px; color:var(--pink); font-weight:800;}

  /* The START button is pinned to the bottom of the sheet rather than sitting
     at the end of the list.

     It used to be the last thing after eight upgrades, a changelog and a build
     stamp, so the only way to start a level was to scroll to the bottom - and
     the moment scrolling broke, the game was over. A control that ends the
     screen should not depend on reaching the end of the screen. */
  .gowrap{
    position:sticky; bottom:0; z-index:4;
    margin:14px -14px 0; padding:12px 14px calc(var(--safe-b) + 12px);
    background:linear-gradient(rgba(244,232,255,0), #f4e8ff 34%);
  }
  .go{
    width:100%; border:4px solid var(--edge); border-radius:16px; padding:16px;
    font-size:17px; letter-spacing:.12em; font-weight:800; font-family:inherit;
    background:linear-gradient(#ff7ab0,#e8226e); color:#fff; box-shadow:0 6px 0 var(--edge);
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .go:active{transform:translateY(4px); box-shadow:0 2px 0 var(--edge);}

  /* Version, patch notes and build stamp.

     The stamp is how a deploy is verified on the phone: an installed PWA can be
     a load behind, and the game looks identical between builds, so there is
     otherwise nothing to check. The version and notes answer the different
     question of what actually changed. */
  .verline{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:14px; padding-top:12px; border-top:2px solid rgba(60,20,80,.15);
    font-size:12.5px; font-weight:800; letter-spacing:.1em; color:var(--pink);
  }
  .notesbtn{
    border:2px solid var(--pink); background:#ffe3f0; color:var(--pink);
    border-radius:10px; padding:7px 11px; font-size:10.5px; font-weight:800; letter-spacing:.09em;
  }
  .notes{max-height:210px; overflow-y:auto; margin-top:10px;}
  .notes.hidden{display:none;}
  .rel{padding:9px 0; border-top:1px solid rgba(60,20,80,.12);}
  .rel:first-child{border-top:none;}
  .relhead{font-size:11.5px; font-weight:800; color:var(--ink);}
  .relhead .v{color:var(--pink);}
  .relhead .d{color:#9a7aa8; font-weight:600;}
  .rel ul{margin:5px 0 0; padding-left:15px; color:#6a4a7c; font-size:11px; line-height:1.6; font-weight:600;}
  .stamp{
    margin-top:12px; padding-top:10px; border-top:1px solid rgba(60,20,80,.12);
    font:10.5px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;
    color:#9a7aa8; text-align:center;
  }

  #flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; z-index:30;}
  #vig{position:fixed; inset:0; pointer-events:none; opacity:0; z-index:29;
    box-shadow:inset 0 0 55px 4px rgba(232,50,76,.9); transition:opacity .2s;}
  #boot{position:fixed; inset:0; z-index:40; background:linear-gradient(#3aa8ee,#bfeaff);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    font-size:27px; letter-spacing:.22em;}
  #boot.hidden{display:none;}
  #err{position:fixed; inset:0; z-index:99; background:#180508; color:#ffb0b8; padding:20px;
    font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; overflow:auto; font-weight:400;}
  #err.hidden{display:none;}
</style>
</head>
<body>


<div id="game"></div>

<div id="hud">
  <div class="toprow">
    <div class="panel" id="level">1<small>LEVEL</small></div>
    <div class="money out" id="coinsWrap">$<span id="coins">0</span></div>
  </div>
  <div id="bars"><div id="prog"><i></i></div></div>
</div>

<div id="countBox" class="out">
  <div id="countN">4</div><small>CANDLES</small>
</div>

<div id="valBox">
  <div class="lbl">VALUE</div>
  <div id="eachN" class="out">$0</div>
  <div id="cashN" class="out">$0</div>
</div>

<div id="stackBox">
  <small>BANDS</small>
  <div id="stack"></div>
</div>

<div id="toast" class="out"></div>
<div id="hint" class="out">DRAG TO STEER</div>
<div id="pops"></div>

<div id="shopScreen" class="modal hidden">
  <div class="sheet">
    <div class="shead">
      <h2 class="out" id="shopTitle">THE WORKSHOP</h2>
      <div class="sub" id="shopSub">READY TO RUN</div>
      <div class="bal out">
        <span>$<b id="sCoins">0</b></span>
        <span><em>BEST</em> $<b id="sBest">0</b></span>
        <span><em>★</em> <b id="sStars">0</b></span>
      </div>
    </div>

    <div id="result" class="hidden">
      <!-- The reference measures a finished run on a vertical gauge with a
           numeric scale rather than awarding stars. The stars stay underneath
           as the between-level goal, but the gauge is the moment. -->
      <div id="gauge"><div id="gaugeTicks"></div><div id="gaugeFill"></div><div id="gaugeMark"></div></div>
      <div id="rStars"></div>
      <div id="rRows"></div>
      <div class="rtot"><span>PAID</span><b id="rTotal">$0</b></div>
    </div>

    <div id="shop"></div>

    <div class="verline">
      <span id="verNum">v0.0.0</span>
      <button id="btnNotes" class="notesbtn">WHAT&apos;S NEW</button>
    </div>
    <div id="notes" class="notes hidden"></div>
    <div class="stamp" id="build"></div>

    <div class="gowrap"><button class="go" id="btnGo">START THE LINE</button></div>
  </div>
</div>

<div id="vig"></div>
<div id="flash"></div>
<div id="boot" class="out">CANDLE GIFT</div>
<div id="err" class="hidden"></div>

<script type="module" src="/src/main.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>

</body>
</html>
