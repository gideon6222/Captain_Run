<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa8ee"/>
      <stop offset="1" stop-color="#bfeaff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- the runway, narrowing away from the viewer -->
  <path d="M96 512 L416 512 L330 232 L182 232 Z" fill="#5a27ab"/>
  <path d="M182 232 L330 232 L322 206 L190 206 Z" fill="#7440c9"/>
  <path d="M96 512 L110 512 L190 206 L182 206 Z" fill="#f0e4ff"/>
  <path d="M402 512 L416 512 L330 206 L322 206 Z" fill="#f0e4ff"/>

  <!-- a tray of banded candles, three abreast, newest band on top -->
  <g stroke="#2b0f36" stroke-width="11" stroke-linejoin="round">
    <g>
      <rect x="150" y="300" width="66" height="60" fill="#fff0d0"/>
      <rect x="150" y="360" width="66" height="56" fill="#4fe3f0"/>
      <rect x="150" y="416" width="66" height="56" fill="#ff4d8d"/>
    </g>
    <g>
      <rect x="223" y="286" width="66" height="60" fill="#fff0d0"/>
      <rect x="223" y="346" width="66" height="56" fill="#4fe3f0"/>
      <rect x="223" y="402" width="66" height="70" fill="#ff4d8d"/>
    </g>
    <g>
      <rect x="296" y="300" width="66" height="60" fill="#fff0d0"/>
      <rect x="296" y="360" width="66" height="56" fill="#4fe3f0"/>
      <rect x="296" y="416" width="66" height="56" fill="#ff4d8d"/>
    </g>
  </g>
  <!-- wicks -->
  <g fill="#2b0f36">
    <rect x="177" y="276" width="12" height="26" rx="5"/>
    <rect x="250" y="262" width="12" height="26" rx="5"/>
    <rect x="323" y="276" width="12" height="26" rx="5"/>
  </g>

  <!-- the hot-pink station sign that labels every gantry in the game -->
  <g>
    <rect x="118" y="112" width="276" height="92" rx="46" fill="#e8226e" stroke="#8e0b40" stroke-width="12"/>
    <rect x="146" y="130" width="220" height="24" rx="12" fill="#ffffff" opacity="0.22"/>
    <text x="256" y="170" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif"
          font-size="58" font-weight="800" fill="#ffffff">CANDLE</text>
  </g>
</svg>
